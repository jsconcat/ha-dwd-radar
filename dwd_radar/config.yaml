name: DWD Regenradar
version: "0.13.1"
slug: dwd_radar
description: Regenradar aus DWD-Open-Data (Radar, 2-h-Vorhersage, ICON-Modelle bis 7 Tage, Temperaturen, Unwetterwarnungen) als WebGL-Karte unter /local/dwd-radar/
url: https://github.com/jsconcat/ha-dwd-radar
arch:
  - amd64
  - aarch64
startup: application
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  home_name: Zuhause
  home_lat: 49.567
  home_lon: 8.317
  area_radius_km: 120
  zoom: 10
  forecast_days: 7
  theme: auto
  temperatures: toggle
  warnings: toggle
  show_clouds: true
  reset_view_s: 90
  pins: []
schema:
  # --- Grundeinstellungen (immer sichtbar)
  home_name: str
  home_lat: float(45,56)
  home_lon: float(3,17)
  area_radius_km: int(40,250)
  zoom: int(5,14)
  forecast_days: int(0,7)
  theme: list(auto|light|dark)
  temperatures: list(off|on|toggle)
  warnings: list(off|on|toggle)
  show_clouds: bool
  reset_view_s: int(0,120)
  pins:
    - name: str?
      lat: float(-90,90)
      lon: float(-180,180)
      home: bool?
  # --- Erweitert (optional: in HA unter "Nicht verwendete optionale Konfigurationsoptionen anzeigen")
  min_zoom: int(4,14)?
  max_zoom: int(6,14)?
  past_minutes: int(0,240)?
  show_forecast: bool?
  radar_opacity: float(0.2,1)?
  cloud_opacity: float(0.1,1)?
  resolution_m: int(150,2000)?
  smoothing_km: float(0,5)?
  frame_ms: int(100,3000)?
  hold_now_ms: int(0,10000)?
  hold_end_ms: int(0,10000)?
  controls_hide_s: int(2,60)?
  stale_minutes: int(10,180)?
  hillshade: bool?
  hillshade_strength: float(0,3)?
  basemap: list(own|basemapde|carto|osm)?
  carto_key: str?
  basemap_filter: str?
  log_level: list(debug|info|warning|error)?
