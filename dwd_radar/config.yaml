name: DWD Regenradar
version: "0.12.3"
slug: dwd_radar
description: Regenradar aus DWD-Open-Data (RV-Komposit + 2-h-Vorhersage) als Leaflet-Seite unter /local/dwd-radar/
url: https://github.com/jsconcat/ha-dwd-radar
arch:
  - amd64
  - aarch64
startup: application
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  home_name: Zuhause
  home_lat: 49.567
  home_lon: 8.317
  pins: []
  area_radius_km: 120
  resolution_m: 500
  smoothing_km: 1.0
  radar_opacity: 1.0
  zoom: 9
  min_zoom: 7
  max_zoom: 12
  past_minutes: 120
  show_forecast: true
  frame_ms: 450
  hold_now_ms: 1500
  hold_end_ms: 2500
  controls_hide_s: 6
  reset_view_s: 90
  stale_minutes: 20
  hillshade: true
  hillshade_strength: 1.0
  basemap: own
  carto_key: ""
  basemap_filter: ""
  show_clouds: true
  cloud_opacity: 1.0
  forecast_days: 7
  theme: auto
  temperatures: toggle
  log_level: info
schema:
  home_name: str
  home_lat: float(45,56)
  home_lon: float(3,17)
  pins:
    - name: str?
      lat: float(-90,90)
      lon: float(-180,180)
      home: bool?
  area_radius_km: int(40,250)
  resolution_m: int(150,2000)
  smoothing_km: float(0,5)
  radar_opacity: float(0.2,1)
  zoom: int(5,14)
  min_zoom: int(4,14)
  max_zoom: int(6,14)
  past_minutes: int(0,240)
  show_forecast: bool
  frame_ms: int(100,3000)
  hold_now_ms: int(0,10000)
  hold_end_ms: int(0,10000)
  controls_hide_s: int(2,60)
  reset_view_s: int(0,120)
  stale_minutes: int(10,180)
  hillshade: bool
  hillshade_strength: float(0,3)
  basemap: list(own|basemapde|carto|osm)
  carto_key: str?
  basemap_filter: str?
  show_clouds: bool
  cloud_opacity: float(0.1,1)
  forecast_days: int(0,7)
  theme: list(auto|light|dark)
  temperatures: list(off|on|toggle)
  log_level: list(debug|info|warning|error)
